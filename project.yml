name: Corpospeak
options:
  bundleIdPrefix: com.alexcollins
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# Spelled out because xcodegen ships no setting presets here: without these, DEBUG is never
# defined and every `#if DEBUG` in the app silently compiles to nothing — which is a very quiet
# way to lose a diagnostic you are relying on.
configs:
  Debug: debug
  Release: release
settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: DEBUG=1
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ALWAYS_SEARCH_USER_PATHS: NO
packages:
  # Kokoro's voices, and nothing else from this package. Pinned exactly, not `from:`, because
  # it is early-version and moves fast, and Actionable ships the same build for its diarizer —
  # the two apps drifting onto different Core ML conversions is a debugging problem nobody
  # wants. Bump both together. See docs/voice-engine.md.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.6
targets:
  Corpospeak:
    type: application
    # One target, three destinations: Mac, iPhone, and iPad.
    supportedDestinations: [macOS, iOS]
    dependencies:
      - package: FluidAudio
    sources:
      - path: Corpospeak
        excludes: [KokoroModels]
      # A folder reference, so the .mlmodelc bundles are copied into the app exactly as they
      # are. Anything else lets Xcode's Core ML build step rewrite already-compiled models.
      - path: Corpospeak/KokoroModels
        type: folder
        buildPhase: resources
    info:
      path: Corpospeak/Info.plist
      properties:
        CFBundleDisplayName: Corpospeak
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: Corpospeak listens continuously so it can translate what you say.
        NSSpeechRecognitionUsageDescription: Corpospeak transcribes your speech on-device so it can translate it.
        NSHumanReadableCopyright: © 2026 Alex Collins
        # iOS and iPadOS
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Corpospeak/Corpospeak.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexcollins.CorpSpeak # The App Store identity; must never change.
        PRODUCT_NAME: Corpospeak
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 6T4RVD5724
        # The sandbox entitlements above are for the Mac; iOS gets none.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Corpospeak/Corpospeak-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Corpospeak/Corpospeak-iOS.entitlements
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
  # A UI test target that runs on Alex's own iPhone. It exists because the things this app's
  # App Store frames have to show — a real recogniser hearing a real voice, a real Personal
  # Voice in the menu — do not exist in any simulator (docs/device-capture.md, CAPTURE.md).
  # It is not built or shipped with the app: nothing in the Corpospeak target depends on it.
  CorpospeakUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [CorpospeakUITests]
    dependencies:
      - target: Corpospeak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexcollins.CorpSpeak.uitests
        # Both spelled out because the app target sets them per-target rather than at project
        # level, so a second target inherits neither: without PRODUCT_NAME the runner builds as
        # "-Runner.app" and two build commands collide on the same empty path.
        PRODUCT_NAME: CorpospeakUITests
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6T4RVD5724
        TEST_TARGET_NAME: Corpospeak
        GENERATE_INFOPLIST_FILE: true
schemes:
  CorpospeakUITests:
    build:
      targets:
        Corpospeak: [run, test]
        CorpospeakUITests: [test]
    test:
      # The test plan is what turns the screen recording on. Without it the run keeps
      # screenshots only, and T038's video has nowhere to come from.
      testPlans:
        - path: CorpospeakUITests/DeviceCapture.xctestplan
          defaultPlan: true
